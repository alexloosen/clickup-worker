name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/puppeteer-bugs/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugins/puppeteer-bugs/source/package-lock.json
      - run: npm ci
      - run: node build.mjs
      - run: node test-platform.mjs
      - if: runner.os == 'Windows'
        run: node test.mjs
      - if: runner.os != 'Windows'
        run: sh -n ../../../install.sh
