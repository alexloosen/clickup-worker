x-width:600px){.sourcebar{padding:0 12px 10px}.sourcebar .hint{display:none}.filter-grid{grid-template-columns:1fr}.filter-grid .wide{grid-column:auto}.filter-menu .custom-rule{grid-template-columns:1fr 1fr}.filter-menu .custom-rule button{width:30px}.filter-menu .filter-actions{flex-wrap:wrap}}

/* A quieter hierarchy keeps primary task actions distinct from maintenance. */
:root{--muted:#626b7c;--line:#dce1eb;--accent:#5e4bd3;--soft:#eeebff}
body{background:linear-gradient(155deg,var(--soft) -95%,var(--bg) 55%);min-height:100vh}
.topbar{padding-top:22px;flex-wrap:wrap}.brand h1{font-size:21px;font-weight:720}.brand small{font-size:9px;letter-spacing:.1em}.mark{width:34px;height:34px;display:grid;place-items:center;padding:0;font-weight:800;background:var(--accent);color:var(--surface);border-radius:11px}.counter{white-space:nowrap}
.connectionbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 22px 20px;font-size:11px;color:var(--muted)}.connection-status{display:inline-flex;align-items:center;gap:6px}.connection-status:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--warn)}.connection-status.online:before{background:var(--green)}#projectInfo{overflow-wrap:anywhere}#lastUpdated{margin-left:auto;font-variant-numeric:tabular-nums}
.sourcebar{padding-bottom:14px}.toolbar{padding-bottom:16px;flex-wrap:wrap}.button{min-height:34px;transition:background .12s,border-color .12s}.button:not(:disabled):hover{border-color:var(--accent);background:var(--soft);color:var(--ink)}.button.primary:not(:disabled):hover{background:var(--accent);color:var(--surface);filter:brightness(1.08)}.button.primary:disabled{background:var(--soft);color:var(--muted);border-color:var(--line);opacity:1}.button.quiet:hover{color:var(--ink)}
.workspace{grid-template-columns:minmax(235px,30%) minmax(0,1fr);gap:20px}.ticket{padding:15px;border-radius:11px;transition:border-color .12s,box-shadow .12s}.ticket.selected{background:linear-gradient(100deg,var(--soft),var(--surface) 65%)}.ticket-title{font-size:14px}.ticket-location{line-height:1.5}.ticket-bottom{flex-wrap:wrap;row-gap:6px}.detail{box-shadow:0 4px 24px #17203a05;border-radius:13px}.detail h2{font-size:23px;letter-spacing:-.02em}.detail-head{padding:24px}.detail-body{padding:22px 24px}.meta{gap:8px}.branch-chip{font:10px ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);padding:3px 7px;border-radius:5px}.description{line-height:1.8}.notice{white-space:pre-wrap;line-height:1.6}.notice.error{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 5%,var(--surface))}.sync-error{border-left:3px solid var(--warn);padding:8px 12px;margin-top:12px;background:color-mix(in srgb,var(--warn) 5%,var(--surface));border-radius:0 6px 6px 0}.hint{font-size:12px}.empty{background:var(--surface);line-height:1.7}.empty strong{display:block;color:var(--ink);font-weight:600}.empty p{margin:7px 0 0}.detail-empty{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px}.detail-empty p{max-width:350px}.empty-symbol{display:grid;place-items:center;width:45px;height:45px;margin-bottom:14px;border-radius:12px;background:var(--soft);color:var(--accent);font-size:27px}.board-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px 20px;color:var(--muted);font-size:11px}.utility input:not([type=checkbox]){width:100%}.utility{box-shadow:0 16px 48px #0002}.utility h3{font-size:15px}.utility .hint{font-size:12px}.working{cursor:progress}
@media(max-width:900px){.workspace{gap:14px;grid-template-columns:minmax(210px,32%) minmax(0,1fr)}.brand h1{font-size:19px}.header-actions{flex-wrap:wrap}}
@media(max-width:650px){.topbar{gap:12px;padding:16px 12px 12px}.header-actions{width:100%}.header-actions #refreshBoard{margin-right:auto}.connectionbar{padding:0 12px 16px;gap:8px 12px}#lastUpdated{margin-left:0;width:100%}.sourcebar #source,.sourcebar #preset{flex:1;min-width:140px;max-width:100%}.workspace{grid-template-columns:1fr;padding:12px}.list{max-height:290px;overflow:auto;padding:2px}.detail-head,.detail-body{padding:18px}.detail h2{font-size:21px}.board-footer{padding:4px 12px 20px;flex-wrap:wrap}.toolbar #startSelected{margin-left:auto}.toolbar .search{order:3;width:100%;flex-basis:65%}.toolbar #status{order:4;flex:1}.counter{font-size:10px}}

</style></head><body>
<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true">✓</span><div><small>YOUR DEVELOPMENT WORKSPACE</small><h1>ClickUp Tasks <span class="counter" id="version"></span> <span class="counter" id="count"></span></h1></div></div><div class="header-actions"><button class="button" id="refreshBoard" title="Fetch the latest tasks from ClickUp" disabled>↻ Refresh</button><button class="button quiet" id="boardTools" disabled>Board tools</button><button class="button" id="setup" title="Configure ClickUp and your repository" disabled><span aria-hidden="true">⚙</span> Setup</button></div></header>
<div class="connectionbar"><span id="connectionStatus" class="connection-status">Connecting…</span><span id="projectInfo"></span><span id="lastUpdated" role="status" aria-live="polite">Not refreshed yet</span></div>
<div class="sourcebar"><select id="source" aria-label="ClickUp list"></select><select id="preset" aria-label="Saved preset"></select><button class="button" id="filters">Filters & presets</button><span class="hint" id="filterSummary"></span></div><div class="toolbar"><div class="tabs"><button class="button primary" id="todo" aria-pressed="true">To do</button><button class="button" id="finished" aria-pressed="false">Finished</button></div><button class="button primary" id="startSelected" disabled>Start selected</button><input class="search" id="search" aria-label="Search tasks" placeholder="Search tasks…" type="search"><select id="status" aria-label="Filter by status"><option value="">All statuses</option></select></div>
<div id="notice" class="notice hidden" role="status" aria-live="polite"></div><main class="workspace"><section aria-label="Tasks"><div class="list" id="list"></div><div class="footer" id="results"></div></section><section id="detail" aria-label="Ticket details"></section></main><footer class="board-footer"><span>Review the task. Choose how to work. Accept when tested.</span><button class="button quiet" id="cleanup">Clean old worktrees</button></footer><div id="utility" class="utility hidden" role="dialog" aria-label="Utility options"></div><script>/* APP_SCRIPT */</script></body></html>
