<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClickUp Tasks</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:light;--bg:#f5f6f9;--surface:#fff;--ink:#252938;--muted:#747b8c;--line:#e2e5ed;--accent:#6754dc;--soft:#eeebff;--green:#267955;--warn:#ad6019}html[data-theme=dark]{color-scheme:dark;--bg:#17191f;--surface:#20232b;--ink:#eef0f8;--muted:#a2a9bb;--line:#343947;--accent:#b4a4ff;--soft:#342e4d;--green:#84d4ab;--warn:#f4b472}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:13px}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.button{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:8px 11px;font-weight:600;font-size:12px;white-space:nowrap;text-decoration:none;display:inline-block}.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}html[data-theme=dark] .primary{color:#19151f}.quiet{border:0;background:transparent;color:var(--muted)}.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 12px;gap:12px}.brand{display:flex;align-items:center;gap:10px}.mark{background:var(--soft);color:var(--accent);border-radius:8px;padding:7px;font-size:18px}.brand h1{font-size:19px;letter-spacing:-.03em;margin:0}.brand small{font-size:10px;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:8px;padding:0 22px 13px;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}.tabs .button{border:0;padding:6px 11px}.search{margin-left:auto;width:230px;min-width:110px}input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px}#status{max-width:155px}.notice{margin:10px 22px 0;border:1px solid var(--line);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--muted)}.notice.error,.sync-error{color:var(--warn)}.workspace{display:grid;grid-template-columns:minmax(220px,27%) minmax(0,1fr);gap:16px;padding:16px 22px 22px;align-items:start}.list{display:flex;flex-direction:column;gap:8px}.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px;cursor:pointer}.ticket:hover{border-color:var(--accent)}.ticket.selected{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.ticket-top{display:flex;align-items:center;gap:8px}.ticket-top input{margin:0;width:14px;height:14px}.ticket-id{font:10px ui-monospace,monospace;color:var(--muted)}.menu-trigger{margin-left:auto;padding:2px 7px;font-size:18px;line-height:1;border:0;background:none;color:var(--muted)}.ticket-title{font-size:13px;font-weight:650;line-height:1.45;margin:10px 0}.ticket-bottom{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:10px}.pill{display:inline-block;padding:3px 7px;border-radius:5px;font-size:11px;background:var(--soft);color:var(--accent);white-space:nowrap}.pill.done{background:transparent;color:var(--green)}.pill.active{color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}.footer{font-size:11px;color:var(--muted);margin:12px 2px}.detail{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}.detail-head{padding:19px 22px 14px;border-bottom:1px solid var(--line)}.meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:11px;flex-wrap:wrap}.detail h2{font-size:21px;letter-spacing:-.025em;line-height:1.35;margin:10px 0 13px;overflow-wrap:anywhere}.actionbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.detail-body{padding:18px 22px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}.description{font-size:13px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 20px}.run{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.run summary,.context summary{cursor:pointer;color:var(--muted);font-size:12px}.run p{font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}textarea{display:block;width:100%;resize:vertical;margin-top:10px;line-height:1.6}.hint{color:var(--muted);font-size:11px;line-height:1.6;margin:8px 0}.empty{padding:28px 20px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:9px}.hidden{display:none!important}.utility{position:fixed;z-index:10;width:290px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px;box-shadow:0 12px 48px #0004}.utility h3{font-size:13px;margin:0 0 12px}.utility label{display:block;font-size:11px;color:var(--muted);margin:10px 0 5px}.utility select{width:100%}.utility .release{border-top:1px solid var(--line);margin-top:14px;padding-top:4px}.utility .confirm{display:flex;gap:8px;align-items:start;line-height:1.5}.utility .confirm input{width:15px;margin:1px 0}.utility .button{margin-top:8px}.utility .close{float:right;margin:-7px -5px 0 0}.sync-error{font-size:12px;line-height:1.5;padding:10px 0}.counter{font-size:11px;color:var(--muted);font-weight:400}.setup-url{word-break:break-all;color:var(--accent);font-size:11px}.menu-action{display:block;width:100%;text-align:left}
@media(max-width:720px){.topbar{padding:12px}.toolbar{padding:0 12px 12px;flex-wrap:wrap}.search{width:160px;flex:1}.workspace{padding:12px;grid-template-columns:190px minmax(0,1fr);gap:10px}.detail-head,.detail-body{padding:14px}.detail h2{font-size:18px}.notice{margin:10px 12px 0}}@media(max-width:520px){.workspace{grid-template-columns:1fr}.list{max-height:220px;overflow:auto}.brand small{display:none}.toolbar .search{order:3;width:100%}.utility{width:290px}}
.comments{border-top:1px solid var(--line);padding-top:14px;margin:16px 0}.comments summary{font-size:12px;cursor:pointer;color:var(--muted)}.comments-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.comment{border-top:1px solid var(--line);padding:7px 0}.comment.reply{margin-left:16px;border-left:2px solid var(--line);padding-left:12px}.comment p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;margin:4px 0 10px}.comments[open]{max-height:380px;overflow:auto}.sourcebar{display:flex;align-items:center;gap:8px;padding:0 22px 10px;flex-wrap:wrap}.sourcebar #source{max-width:320px;min-width:210px}.sourcebar #preset{max-width:240px}.sourcebar .hint{margin-left:auto}.ticket-location{font-size:10px;color:var(--muted);margin:-5px 0 8px;overflow-wrap:anywhere}.finish-receipt{margin:10px 0 0;color:var(--green);font-size:11px}.finish-receipt summary{cursor:pointer}.filter-menu{width:740px}.filter-menu h3{margin-right:32px}.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}.filter-grid .wide{grid-column:1/-1}.filter-menu select[multiple]{width:100%;height:100px}.filter-menu input{width:100%}.filter-menu .dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filter-menu .row{display:flex;gap:8px;align-items:center}.filter-menu .row input{min-width:0}.filter-menu input[type=checkbox]{width:15px}.filter-menu .row .button{margin-top:0}.filter-menu .custom-rule{display:grid;grid-template-columns:1.2fr 1fr 1fr 30px;gap:5px;margin-top:8px}.filter-menu .custom-rule select,.filter-menu .custom-rule input{min-width:0}.filter-menu details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.filter-menu summary{cursor:pointer}.filter-menu .presets-list{max-height:130px;overflow:auto}.filter-menu .preset-row{display:flex;justify-content:space-between;align-items:center}.filter-actions{display:flex;gap:8px;align-items:center;margin-top:12px}.filter-menu .hint{margin:5px 0}.filter-menu .close{margin-top:0}@media(max-width:600px){.sourcebar{padding:0 12px 10px}.sourcebar .hint{display:none}.filter-grid{grid-template-columns:1fr}.filter-grid .wide{grid-column:auto}.filter-menu .custom-rule{grid-template-columns:1fr 1fr}.filter-menu .custom-rule button{width:30px}.filter-menu .filter-actions{flex-wrap:wrap}}
</style></head><body>
<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true">⌘</span><div><small>CLICKUP / GITHUB</small><h1>Tasks <span class="counter" id="count"></span></h1></div></div><button class="button quiet" id="settings" aria-label="Board utilities" title="Setup and utilities">⚙</button></header>
<div class="sourcebar"><select id="source" aria-label="ClickUp list"></select><select id="preset" aria-label="Saved preset"></select><button class="button" id="filters">Filters & presets</button><span class="hint" id="filterSummary"></span></div><div class="toolbar"><div class="tabs"><button class="button primary" id="todo" aria-pressed="true">To do</button><button class="button" id="finished" aria-pressed="false">Finished</button></div><button class="button" id="startSelected" disabled>Start selected</button><input class="search" id="search" aria-label="Search tasks" placeholder="Search within results…" type="search"><select id="status" aria-label="Filter by status"><option value="">All statuses</option></select></div>
<div id="notice" class="notice hidden" role="status" aria-live="polite"></div><main class="workspace"><section aria-label="Tasks"><div class="list" id="list"></div><div class="footer" id="results"></div></section><section id="detail" aria-label="Ticket details"></section></main><div id="utility" class="utility hidden" role="dialog" aria-label="Utility options"></div><script>/* APP_SCRIPT */</script></body></html>
